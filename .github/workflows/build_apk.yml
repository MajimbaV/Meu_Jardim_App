name: Build Flet APK

on:
  push:
    branches: [ "main" ] # Executa a cada push na branch main
  workflow_dispatch: # Permite que você execute o build manualmente se quiser

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-file: '3.13' # Versão recomendada para estabilidade do Flet

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flet
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Build APK with Flet
      run: |
        # O Flet usa o Flutter por baixo dos panos para empacotar o APK
        flet build apk --main main.py

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: meu-jardim-apk
        path: build/apk/app-release.apk # Caminho padrão gerado pelo Flet build