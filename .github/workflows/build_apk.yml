name: Build Flet APK and Signed AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flet
        # CORRIGIDO: Agora aponta para o requirements.txt dentro da pasta app
        if [ -f app/requirements.txt ]; then pip install -r app/requirements.txt; fi

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17' # Necessário para o compilador do Android (Gradle) rodar sem erros

        - name: Decode Keystore
      env:
        PLAY_STORE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        # Transforma o texto do GitHub Secret de volta no arquivo físico keystore de forma segura
        echo "$PLAY_STORE_KEYSTORE" | base64 --decode > app/meu-jardim.keystore

    - name: Build APK with Flet
      run: |
        # O comando 'yes' injeta a resposta "y" automaticamente para aceitar o download do Flutter SDK
        yes | flet build apk app

    - name: Build Signed AAB with Flet (Para Produção)
      env:
        FLET_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        FLET_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        FLET_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        # Compila o AAB injetando as variáveis de ambiente que o Flet exige para assinar o arquivo
        yes | flet build appbundle app --keystore meu-jardim.keystore

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: meu-jardim-apk
        path: app/build/apk/*.apk

    - name: Upload Signed AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: meu-jardim-aab-assinado
        path: app/build/appbundle/*.aab