name: Build Flet APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flet
        # CORRIGIDO: Agora aponta para o requirements.txt dentro da pasta app
        if [ -f app/requirements.txt ]; then pip install -r app/requirements.txt; fi

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17' # Necessário para o compilador do Android (Gradle) rodar sem erros

    - name: Build APK with Flet
      run: |
        # O comando 'yes' injeta a resposta "y" automaticamente para aceitar o download do Flutter SDK
        yes | flet build apk app

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: meu-jardim-apk
        path: build/apk/app-release.apk


    - name: Build APK with Flet
      run: |
        # CORRIGIDO: Passamos a pasta 'app' para o comando flet build apk
        yes | flet build apk app
        
        #Variables do python
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: meu-jardim-apk
        path: app/build/apk/app-release.apk # <- CORRIGIDO: Adicionado 'app/' no início do caminho